openapi: 3.1.0
info:
  title: RecycleConnect API
  version: 1.0.0
  description: >-
    Contract for routes on the inspected backend Production branch, including
    email/password and profile additions pushed in commit dd0be3e. Routes are
    versioned under /v1. The PRD production URL is not verified as deployed.
servers:
  - url: http://localhost:3000/v1
    description: Local backend default
tags:
  - name: Auth
  - name: Users
  - name: Rates
  - name: Pickups
  - name: Collector
  - name: Admin
security:
  - bearerAuth: []
paths:
  /auth/google:
    post:
      tags: [Auth]
      operationId: googleSignIn
      summary: Sign in or create an account with Google
      description: Public. A role is required only when creating a new user; allowed new-user roles are HOUSEHOLD, ESTATE, and COLLECTOR.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: JWT and user row
          content:
            application/json:
              schema:
                type: object
                required: [token, user, is_new_user]
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/RawUser' }
                  is_new_user: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid Google token, error object }
  /auth/signup:
    post:
      tags: [Auth]
      operationId: passwordSignUp
      summary: Create an account with email and password
      description: >-
        Present in backend Production as of commit dd0be3e. User-requested
        extension to the PRD's Google-only signup.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password, role]
              properties:
                full_name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, maxLength: 254, format: email }
                phone: { type: [string, 'null'] }
                password: { type: string, minLength: 8, maxLength: 128 }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Account created and JWT issued
          content:
            application/json:
              schema:
                type: object
                required: [token, user, is_new_user]
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/RawUser' }
                  is_new_user: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: passwordLogin
      summary: Sign in with email or phone and password
      description: Present in backend Production as of commit dd0be3e.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email: { type: string, description: Use email or identity. }
                identity: { type: string, description: Email address or phone number. }
                password: { type: string }
      responses:
        '200':
          description: JWT and user row
          content:
            application/json:
              schema:
                type: object
                required: [token, user, is_new_user]
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/RawUser' }
                  is_new_user: { type: boolean, const: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyCollectorOtp
      summary: Verify collector phone using the demo OTP
      description: Collector JWT required. Current backend accepts the fixed demo OTP 123456.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone: { type: string }
                otp: { type: string, example: '123456' }
      responses:
        '200':
          description: Phone verification result
          content:
            application/json:
              schema:
                type: object
                required: [phone_verified]
                properties:
                  phone_verified: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/onboarding:
    patch:
      tags: [Users]
      operationId: saveOnboarding
      summary: Save household or estate profile and create recurring pickup
      description: ESTATE accounts are forced to WEEKLY by the backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, address]
              properties:
                full_name: { type: string }
                address: { type: string }
                phone: { type: [string, 'null'] }
                pickup_interval: { type: string, enum: [WEEKLY, BIWEEKLY], default: WEEKLY }
                usual_materials: { type: array, items: { $ref: '#/components/schemas/Material' }, default: [] }
                lat: { type: [number, 'null'] }
                lng: { type: [number, 'null'] }
      responses:
        '200':
          description: Updated user and next pickup timestamp
          content:
            application/json:
              schema:
                type: object
                required: [user, next_pickup]
                properties:
                  user: { $ref: '#/components/schemas/RawUser' }
                  next_pickup: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/profile:
    patch:
      tags: [Users]
      operationId: updateUserProfile
      summary: Update household or estate profile details
      description: Present in backend Production as of commit dd0be3e.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, address]
              properties:
                full_name: { type: string }
                address: { type: string }
                phone: { type: [string, 'null'] }
      responses:
        '200':
          description: Updated user row
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/RawUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/pause-toggle:
    patch:
      tags: [Users]
      operationId: toggleRecurringPickups
      summary: Pause or resume recurring pickups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_paused]
              properties:
                is_paused: { type: boolean }
      responses:
        '200':
          description: Pause state
          content:
            application/json:
              schema:
                type: object
                required: [is_paused]
                properties:
                  is_paused: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rates:
    get:
      tags: [Rates]
      operationId: getRates
      summary: List material rates
      responses:
        '200':
          description: Rates ordered by material
          content:
            application/json:
              schema:
                type: object
                required: [rates]
                properties:
                  rates:
                    type: array
                    items: { $ref: '#/components/schemas/Rate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /pickups/dashboard:
    get:
      tags: [Pickups]
      operationId: getHouseholdDashboard
      summary: Get household or estate dashboard data
      responses:
        '200':
          description: Next pickup, rates, wallet balance, pause state, history, and notifications
          content:
            application/json:
              schema:
                type: object
                required: [next_pickup, rates, currency, wallet_balance, wallet_balance_formatted, is_paused, history, notifications]
                properties:
                  next_pickup: { oneOf: [{ $ref: '#/components/schemas/NextPickup' }, { type: 'null' }] }
                  rates: { type: array, items: { $ref: '#/components/schemas/Rate' } }
                  currency: { type: string, const: NGN }
                  wallet_balance: { type: integer }
                  wallet_balance_formatted: { type: string }
                  is_paused: { type: boolean }
                  history: { type: array, items: { $ref: '#/components/schemas/PickupHistory' } }
                  notifications: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pickups/one-off:
    post:
      tags: [Pickups]
      operationId: createOneOffPickup
      summary: Schedule a one-off pickup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [materials, scheduled_date, load_photo_url]
              properties:
                materials: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Material' } }
                scheduled_date: { type: string, description: Must be a date value parseable by JavaScript and in the future. }
                load_photo_url: { type: string, description: Required non-empty image reference; the backend does not validate the URL scheme. }
      responses:
        '201':
          description: Pickup created
          content:
            application/json:
              schema:
                type: object
                required: [pickup_id, status]
                properties:
                  pickup_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/PickupStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pickups/{id}/skip:
    patch:
      tags: [Pickups]
      operationId: skipPickup
      summary: Skip a scheduled pickup
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pickup skipped
          content:
            application/json:
              schema:
                type: object
                required: [pickup_id, status]
                properties:
                  pickup_id: { type: string, format: uuid }
                  status: { type: string, const: SKIPPED }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /pickups/{id}/confirm:
    post:
      tags: [Pickups]
      operationId: confirmPickup
      summary: Confirm a completed pickup or open a dispute
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [THUMBS_UP, THUMBS_DOWN] }
                reason: { type: string, description: Used as the dispute reason for THUMBS_DOWN. }
      responses:
        '200':
          description: Confirmation recorded
          content:
            application/json:
              schema:
                type: object
                required: [confirmation_status]
                properties:
                  confirmation_status: { type: string, enum: [THUMBS_UP, THUMBS_DOWN] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /collectors/kyc:
    post:
      tags: [Collector]
      operationId: submitCollectorKyc
      summary: Submit collector verification details
      description: Requires phone verification first. Document and selfie values are URLs; the API does not upload or validate image capture source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nin_number, id_doc_type, id_doc_url, live_selfie_url, guarantor_name, guarantor_phone, guarantor_relationship]
              properties:
                nin_number: { type: string }
                id_doc_type: { type: string }
                id_doc_url: { type: string, description: Required non-empty media reference; the backend does not validate the URL scheme. }
                live_selfie_url: { type: string, description: Required non-empty media reference; the backend does not validate capture source. }
                guarantor_name: { type: string }
                guarantor_phone: { type: string }
                guarantor_relationship: { type: string }
      responses:
        '201':
          description: KYC submitted for review
          content:
            application/json:
              schema:
                type: object
                required: [kyc_status]
                properties:
                  kyc_status: { type: string, const: PENDING }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collector/map-pins:
    get:
      tags: [Collector]
      operationId: getCollectorMapPins
      summary: List pickup pins for an approved collector
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Optional date filter in YYYY-MM-DD format.
      responses:
        '200':
          description: Eligible pickup pins. Current response also contains materials, address, date, and status; see privacy note in API-GUIDE.md.
          content:
            application/json:
              schema:
                type: object
                required: [pins]
                properties:
                  pins:
                    type: array
                    items:
                      type: object
                      properties:
                        pickup_id: { type: string, format: uuid }
                        lat: { type: [number, 'null'] }
                        lng: { type: [number, 'null'] }
                        address: { type: [string, 'null'] }
                        scheduled_date: { type: string, format: date-time }
                        status: { $ref: '#/components/schemas/PickupStatus' }
                        materials: { type: array, items: { $ref: '#/components/schemas/Material' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collector/pickups/{id}/status:
    patch:
      tags: [Collector]
      operationId: updateCollectorPickupStatus
      summary: Mark a pickup en route or arrived
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [EN_ROUTE, ARRIVED] }
      responses:
        '200':
          description: Status updated and household notification inserted
          content:
            application/json:
              schema:
                type: object
                required: [status, notification_sent]
                properties:
                  status: { type: string, enum: [EN_ROUTE, ARRIVED] }
                  notification_sent: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /collector/pickups/{id}/weigh:
    post:
      tags: [Collector]
      operationId: weighPickup
      summary: Record weights and credit the household wallet
      description: Weight entries must be positive numbers for known materials. A scale photo URL is required when householder_present is false. Currency amounts are integer Naira.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [householder_present, weights]
              properties:
                householder_present: { type: boolean }
                scale_photo_url: { type: string, description: Required when householder_present is false; the backend does not validate the URL scheme or capture source. }
                weights:
                  type: object
                  minProperties: 1
                  additionalProperties: { type: number, exclusiveMinimum: 0 }
                  propertyNames: { enum: [PET, CANS, CARTONS, GLASS] }
      responses:
        '200':
          description: Pickup completed and wallet credited
          content:
            application/json:
              schema:
                type: object
                required: [total_kg, total_payout, currency, total_payout_formatted, wallet_credited]
                properties:
                  total_kg: { type: number }
                  total_payout: { type: integer }
                  currency: { type: string, const: NGN }
                  total_payout_formatted: { type: string }
                  wallet_credited: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/rates:
    patch:
      tags: [Admin]
      operationId: updateRates
      summary: Set one or more rates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rates]
              properties:
                rates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [material, rate_per_kg]
                    properties:
                      material: { $ref: '#/components/schemas/Material' }
                      rate_per_kg: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated rates
          content:
            application/json:
              schema:
                type: object
                required: [updated, rates]
                properties:
                  updated: { type: boolean, const: true }
                  rates: { type: array, items: { $ref: '#/components/schemas/Rate' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/collectors/pending:
    get:
      tags: [Admin]
      operationId: getPendingCollectors
      summary: List pending collector verification records
      responses:
        '200':
          description: Pending collector profiles and user details
          content:
            application/json:
              schema:
                type: object
                required: [pending_collectors]
                properties:
                  pending_collectors: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/collectors/{id}/verify:
    patch:
      tags: [Admin]
      operationId: verifyCollector
      summary: Approve or reject collector KYC
      description: The path id is the collector user ID, not a collector_profiles row ID.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
      responses:
        '200':
          description: Updated KYC status (approval response also contains badge_id)
          content:
            application/json:
              schema:
                type: object
                required: [kyc_status]
                properties:
                  kyc_status: { type: string, enum: [APPROVED, REJECTED] }
                  badge_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/overview:
    get:
      tags: [Admin]
      operationId: getAdminOverview
      summary: Get daily totals and dispute list
      responses:
        '200':
          description: Daily pickup, weight, payout totals, and disputes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  today_pickups: { type: integer }
                  today_kg: { type: number }
                  today_payouts: { type: integer }
                  currency: { type: string, const: NGN }
                  today_payouts_formatted: { type: string }
                  disputes: { type: array, items: { $ref: '#/components/schemas/Dispute' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/disputes:
    get:
      tags: [Admin]
      operationId: getDisputes
      summary: List disputes, pending first
      responses:
        '200':
          description: Disputes
          content:
            application/json:
              schema:
                type: object
                required: [disputes]
                properties:
                  disputes: { type: array, items: { $ref: '#/components/schemas/Dispute' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/disputes/{id}/resolve:
    patch:
      tags: [Admin]
      operationId: resolveDispute
      summary: Resolve a pending dispute
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, ADJUST, SUSPEND] }
                adjusted_payout: { type: integer, minimum: 0, description: Required when action is ADJUST. }
      responses:
        '200':
          description: Resolution saved
          content:
            application/json:
              schema:
                type: object
                required: [dispute_id, admin_resolution]
                properties:
                  dispute_id: { type: string, format: uuid }
                  admin_resolution: { type: string, enum: [APPROVED, ADJUSTED, COLLECTOR_SUSPENDED] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Validation or malformed JSON error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role denied or collector KYC not approved
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Record or route not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Requested state transition is not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Role:
      type: string
      enum: [HOUSEHOLD, ESTATE, COLLECTOR]
    Material:
      type: string
      enum: [PET, CANS, CARTONS, GLASS]
    Rate:
      type: object
      required: [material, rate_per_kg]
      properties:
        material: { $ref: '#/components/schemas/Material' }
        rate_per_kg: { type: integer }
    PickupStatus:
      type: string
      enum: [SCHEDULED, SKIPPED, EN_ROUTE, ARRIVED, COMPLETED, DISPUTED]
    RawUser:
      type: object
      additionalProperties: true
      description: Raw database user row. Exact database schema is not checked into the backend repository.
    NextPickup:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        pickup_type: { type: string, enum: [RECURRING, ONE_OFF] }
        scheduled_date: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/PickupStatus' }
        collector_name: { type: [string, 'null'] }
        collector_badge_id: { type: [string, 'null'] }
    PickupHistory:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        pickup_type: { type: string, enum: [RECURRING, ONE_OFF] }
        scheduled_date: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/PickupStatus' }
        total_kg: { type: [number, 'null'] }
        total_payout: { type: [integer, 'null'] }
        confirmation_status: { type: string, enum: [PENDING, THUMBS_UP, THUMBS_DOWN] }
    Notification:
      type: object
      required: [message, created_at]
      properties:
        message: { type: string }
        created_at: { type: string, format: date-time }
    Dispute:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        pickup_id: { type: string, format: uuid }
        reason: { type: [string, 'null'] }
        admin_resolution: { type: string, enum: [PENDING, APPROVED, ADJUSTED, COLLECTOR_SUSPENDED] }
        adjusted_payout: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }



